evidence:
  firmware:
    - 2026-06-06 QRZL903-1 sample 01 was observed in EDL as MSM8916 serial 0x017a302b.
    - Sample 01 initially had a Linux/OpenWrt-style layout with cdt, sbl1, rpm, tz, hyp, sec, modemst1/2, fsc, fsg, aboot, boot, devinfo, and rootfs.
    - Sample 01 initial boot partition was Android boot image format but contained OpenWrt markers and an embedded FDT whose root model is "ufi-001c 4G Modem Stick" and compatible is "thwc,ufi001c", "qcom,msm8916".
    - 2026-06-06 QRZL903-1 sample 02 booted stock Android/MIKO-style firmware with ADB serial d0b1d17, EDL serial 0x0b723827, baseband UFI001CT 20211106, and build UFI_XG_WFSER_HW03CTDD_220615.
    - Sample 02 uses the Android/MTP-style GPT with the same partition starts as MIKO-QRZL903-1.bin, but userdata is 8MiB smaller to fit the 0xE6800000 eMMC.
    - MIKO-QRZL903-1.zip is a useful older Android-layout reference, but the sample 02 full EDL backup is the preferred local stock baseline.
    - 2026-06-06 sample 01 was restored from OpenWrt/Linux GPT back to Android/MTP GPT using a sample-02-based full image with sample 01 modemst1/2, fsc, and fsg injected.
