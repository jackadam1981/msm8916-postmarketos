firmware:
  known_files:
    - D:/123pan/Downloads/3.53G miko包_UFI003.bin.7z
    - D:/123pan/Downloads/3.61G_miko003.7z
    - out/firmware-packages/miko-full-images/3.53G_miko__UFI003.bin/椰贝003_3.53G miko包.bin
  extraction_notes:
    - Upstream groups this under zhihe,various because lk2nd cannot reliably distinguish it from nearby devices by cmdline alone.
    - The earlier wrong-but-bootable Android package reported ro.build.cust_proj=UFI001C and ro.build.model_type=ZX_UFI001C despite PCB silkscreen UFI003_MB_V02; do not use that historical state as identity evidence.
    - 2026-06-06 runtime DT from restored MIKO/UFI003 firmware reports model "Qualcomm Technologies, Inc. MSM 8916 512MB MTP", compatible qcom,msm8916-mtp/qcom,msm8916/qcom,mtp, qcom,msm-id=<206 0>,<248 0>,<249 0>,<250 0>, qcom,board-id=<8 0x100>.
    - Three-device comparison saved at out/bringup/ufi003-device-tree-comparison-20260606.json. Per-device summaries are stored under out/bringup/ufi003-01/device-tree-20260606/, out/bringup/ufi003-02/device-tree-20260606/, and out/bringup/ufi003-03/device-tree-20260606/.
    - Matching QCDT entry from MIKO boot.img is platform_id=206, variant_id=8, subtype_id=256; extracted as out/bringup/ufi003-03/device-tree-20260606/ufi003-mb-v02.dtb, with the detailed source name also kept as ufi003-mb-v02-selected-board8-subtype0x100.dtb.
    - Decompiled reference DTS is saved as out/bringup/ufi003-03/device-tree-20260606/ufi003-mb-v02.dts; use it for comparison only, not as maintainable upstream source.
    - Current inventory is documented in docs/ufi003-device-inventory.zh-CN.md and device-tree evidence in docs/ufi003-device-tree-evidence.zh-CN.md.
flashing:
  tested_methods:
    - EDL read/write with prog_emmc_firehose_8916_ddr_450.mbn.
    - 3.53G MIKO UFI003 selective restore of aboot/abootbak/boot/recovery/system.
  recovery_notes:
    - Do not write 3.61G whole-disk images blindly; observed UFI003 samples are 3.53G-class eMMC.
    - Preserve per-device modemst1, modemst2, fsg, fsc, ssd, persist, userdata, cache, and modem unless there is a deliberate identity/calibration migration plan.
notes:
  - Hardware marking is identified as UFI003_MB_V02.
  - Standard Linux status still needs lk2nd/lk1st validation on real hardware.
