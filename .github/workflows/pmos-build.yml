name: Build pmOS for MSM8916 (Full Compile)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'pmOS variant (phosh, phosh_light, sxmo, etc.)'
        required: true
        default: 'phosh'
      release_channel:
        description: 'postmarketOS release channel'
        required: true
        default: 'edge'

jobs:
  build:
    runs-on: ubuntu-latest
    # Was 120. The kernel is now compiled from source (device tree overlay),
    # which alone takes 20-40 minutes on a runner.
    timeout-minutes: 300
    permissions:
      contents: write
      packages: read

    steps:
      # ==================================================================
      # 1. Checkout repository
      # ==================================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ==================================================================
      # 2. Install host dependencies
      # ==================================================================
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kpartx coreutils parted e2fsprogs procps kmod
          modprobe loop 2>&1 || echo "loop module not available"

      # ==================================================================
      # 3. Install pmbootstrap
      # ==================================================================
      - name: Install pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          sudo ln -sf /tmp/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
          pmbootstrap --version

      # ==================================================================
      # 4. Build lk1st bootloader (ALWAYS - full compile mode)
      # ==================================================================
      - name: Build lk1st bootloader
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc-arm-none-eabi
          # Use workspace dir instead of /src (runner has no write access to /src)
          LK_DIR="$GITHUB_WORKSPACE/build/lk2nd"
          QS_DIR="$GITHUB_WORKSPACE/build/qtestsign"
          mkdir -p "$GITHUB_WORKSPACE/build"

          # Track upstream main on purpose - we want the newest lk1st, not a
          # frozen one.  lk2nd needs no local patches: board differences live
          # in the device tree, which ships inside boot.img, not in the
          # bootloader.  Recorded in the log so a bad build can be traced
          # back to the exact upstream state.
          #   lk2nd      https://github.com/msm8916-mainline/lk2nd
          #   qtestsign  https://github.com/msm8916-mainline/qtestsign

          git clone https://github.com/msm8916-mainline/lk2nd.git "$LK_DIR"
          echo "=== lk2nd @ $(git -C "$LK_DIR" rev-parse HEAD) ==="
          make -C "$LK_DIR" TOOLCHAIN_PREFIX=arm-none-eabi- lk1st-msm8916

          git clone --depth=1 https://github.com/msm8916-mainline/qtestsign.git "$QS_DIR"
          echo "=== qtestsign @ $(git -C "$QS_DIR" rev-parse HEAD) ==="
          pip3 install cryptography --break-system-packages --no-cache-dir
          python3 "$QS_DIR/qtestsign.py" aboot "$LK_DIR/build-lk1st-msm8916/emmc_appsboot.mbn"

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -L "$LK_DIR/build-lk1st-msm8916/emmc_appsboot-test-signed.mbn" "$GITHUB_WORKSPACE/out/lk1st-msm8916.mbn"

          # aboot is exactly 1 MiB.  A signed lk1st that outgrows it gets
          # silently truncated at flash time, so fail the build instead.
          LK_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/out/lk1st-msm8916.mbn")
          echo "=== lk1st size: $LK_SIZE bytes (aboot partition = 1048576) ==="
          if [ "$LK_SIZE" -gt 1048576 ]; then
            echo "ERROR: lk1st does not fit in the 1 MiB aboot partition"
            exit 1
          fi

      # ==================================================================
      # 5. Build rootfs and images (ALWAYS)
      # ==================================================================
      - name: Build rootfs and images
        run: |
          set -eu
          DEVICE="410stick-ufi003-mb-v02"
          WORK="$HOME/.local/var/pmbootstrap"
          OVERLAY_SRC="$GITHUB_WORKSPACE/config/device-testing"

          echo "=== Loop device support ==="
          ls -la /dev/loop* 2>&1 || true
          modprobe loop 2>&1 || true

          mkdir -p "$WORK/cache_git"
          printf '8\n' > "$WORK/version"

          if [ ! -d "$WORK/cache_git/pmaports" ]; then
            echo "=== Cloning pmaports (first run) ==="
            git clone --depth=1 \
              https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
              "$WORK/cache_git/pmaports"
          else
            echo "=== Using cached pmaports ==="
          fi

          if [ -d "$OVERLAY_SRC" ]; then
            echo "=== Merging local device overlay from $OVERLAY_SRC ==="
            for device_dir in "$OVERLAY_SRC"/*/; do
              [ -d "$device_dir" ] || continue
              devname=$(basename "$device_dir")
              echo "  Adding device: $devname"
              cp -r "$device_dir" "$WORK/cache_git/pmaports/device/testing/$devname"
            done
          fi

          # ------------------------------------------------------------------
          # Kernel package overlay: adds msm8916-zhihe-ufi003-mb-v02.dts so the
          # DTB is built by the kernel instead of shipping a prebuilt binary.
          # The directory must already exist in pmaports, we only merge into it.
          # ------------------------------------------------------------------
          KERNEL_OVERLAY_SRC="$GITHUB_WORKSPACE/config/kernel-testing"
          if [ -d "$KERNEL_OVERLAY_SRC" ]; then
            echo "=== Merging local kernel overlay from $KERNEL_OVERLAY_SRC ==="
            for kdir in "$KERNEL_OVERLAY_SRC"/*/; do
              [ -d "$kdir" ] || continue
              kname=$(basename "$kdir")
              kdest="$WORK/cache_git/pmaports/device/testing/$kname"
              if [ ! -d "$kdest" ]; then
                echo "ERROR: kernel package $kname not found in pmaports"
                echo "       upstream probably moved it; update UPSTREAM_PATH in"
                echo "       scripts/pmaports/sync-kernel-apkbuild.py"
                exit 1
              fi

              ours=$(sed -n 's/^pkgver=//p' "$kdir/APKBUILD" | head -1)
              theirs=$(sed -n 's/^pkgver=//p' "$kdest/APKBUILD" | head -1)
              echo "  Overlaying kernel package: $kname (ours $ours, pmaports $theirs)"
              cp -r "$kdir"/. "$kdest"/

              # Warn loudly if the overlay is pinned to an older kernel than
              # pmaports ships, so nobody silently builds a stale kernel.
              if [ -n "$ours" ] && [ -n "$theirs" ] && [ "$ours" != "$theirs" ]; then
                echo "::warning::kernel overlay is on $ours but pmaports ships $theirs - run scripts/pmaports/sync-kernel-apkbuild.py"
              fi
            done
          fi

          DEVICE_DIR="device-${DEVICE}"
          if [ ! -f "$WORK/cache_git/pmaports/device/testing/${DEVICE_DIR}/deviceinfo" ]; then
            echo "ERROR: Device overlay not found"
            exit 1
          fi

          git -C "$WORK/cache_git/pmaports" update-ref refs/remotes/origin/main \
            "$(git -C "$WORK/cache_git/pmaports" rev-parse HEAD)"

          mkdir -p "$HOME/.config"
          printf '%s\n' \
            '[pmbootstrap]' \
            "work = $WORK" \
            "device = $DEVICE" \
            'ui = console' \
            'user = pmos' \
            'extra_space = 0' \
            '' \
            '[mirrors]' \
            'alpine = https://dl-cdn.alpinelinux.org/alpine/' \
            'pmaports = https://mirror.postmarketos.org/postmarketos/' \
            > "$HOME/.config/pmbootstrap_v3.cfg"
          cat "$HOME/.config/pmbootstrap_v3.cfg"

          # Build the patched kernel explicitly so a broken device tree fails
          # here with a readable log instead of somewhere inside `install`.
          # pkgrel is bumped past the binary repo version, so this really does
          # recompile rather than pulling the published apk.
          pmbootstrap build linux-postmarketos-qcom-msm8916

          # Sanity check: the whole point of the overlay is this one file.
          KPKG=$(find "$WORK/packages" -name "linux-postmarketos-qcom-msm8916-*.apk" 2>/dev/null | head -1)
          if [ -z "$KPKG" ]; then
            echo "ERROR: kernel package was not built into $WORK/packages"
            exit 1
          fi
          echo "=== checking $KPKG ==="
          if ! tar -tzf "$KPKG" | grep -q "boot/dtbs/qcom/msm8916-zhihe-ufi003-mb-v02.dtb"; then
            echo "ERROR: built kernel package does not contain our DTB"
            echo "       the dts patch probably failed to apply or to compile"
            exit 1
          fi
          echo "=== DTB present in kernel package ==="

          # --split: without it pmbootstrap emits a *disk* image (GPT with a
          # pmos_boot and a pmos_root partition) meant to be written to a whole
          # device.  We flash into the userdata partition instead, so we need
          # the root filesystem on its own.  The collect step carves it out
          # anyway, but asking for the right thing first keeps the log readable.
          pmbootstrap --as-root install --password pmos --no-fde --split

          pmbootstrap --as-root shutdown

      # ==================================================================
      # 6. Collect: boot + rootfs + lk1st + EDL scripts + Chinese README
      # ==================================================================
      - name: Collect and pack all components
        run: |
          set -eu
          WORK="$HOME/.local/var/pmbootstrap"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          
          # 收集 pmbootstrap 生成的镜像 (移除 vmlinuz)
          # 注意: 搜索整个 $WORK（排除 cache），不能只搜 $WORK/output，
          # 否则 rootfs/boot.img 会漏掉，最终 zip 只剩 lk1st + 脚本（~117 KB）
          find "$WORK" -type f \( -name "*.img" -o -name "boot.img" \) \
            -not -path "*/cache*" 2>/dev/null | while read f; do
            cp -L "$f" "$OUT/" 2>/dev/null || true
          done

          IMG_COUNT=$(find "$OUT" -maxdepth 1 -name "*.img" | wc -l)
          echo "=== Collected $IMG_COUNT image(s) ==="
          if [ "$IMG_COUNT" -eq 0 ]; then
            echo "ERROR: no .img collected - pmbootstrap install produced nothing?"
            find "$WORK" -maxdepth 3 -type d 2>/dev/null | head -20
            exit 1
          fi

          # --split changes what install emits; make sure boot.img is still one
          # of the artefacts instead of finding out when someone flashes.
          for required in boot.img lk1st-msm8916.mbn; do
            if [ ! -f "$OUT/$required" ]; then
              echo "ERROR: $required missing from $OUT"
              ls -lh "$OUT"
              exit 1
            fi
          done
          echo "=== boot.img and lk1st present ==="
          
          # lk1st 已在 Step 4 中构建，直接复制
          if [ -f "$GITHUB_WORKSPACE/out/lk1st-msm8916.mbn" ]; then
            echo "=== Found lk1st binary ==="
          fi
          
          # 复制 EDL 刷机脚本 (仓库文件，避免 YAML here-doc 解析问题)
          cp "$GITHUB_WORKSPACE/scripts/flash_edl_original.bat" "$OUT/"
          cp "$GITHUB_WORKSPACE/scripts/flash_edl_secondary.bat" "$OUT/"

          # 复制 EDL 工具本体 (edl.exe + firehose loader)，让用户解压即可刷机
          mkdir -p "$OUT/edl"
          cp "$GITHUB_WORKSPACE/flash_tools/edl.exe" "$OUT/edl/"
          cp "$GITHUB_WORKSPACE/flash_tools/prog_emmc_firehose_8916.mbn" "$OUT/edl/"
          cp "$GITHUB_WORKSPACE/flash_tools/prog_emmc_firehose_8916_gucci_peek.mbn" "$OUT/edl/"
          echo "=== edl tooling ==="
          ls -lh "$OUT/edl/"

          # WinUSB 驱动安装工具。用户第一步就卡在这，别让他去外网找。
          cp "$GITHUB_WORKSPACE/flash_tools/zadig-2.9.exe" "$OUT/"
          echo "=== zadig ==="
          ls -lh "$OUT/zadig-2.9.exe"
          
          # 新 GPT 分区表（主表 + 备份 + rawprogram 参考）
          cp "$GITHUB_WORKSPACE/config/gpt/gpt_pmos_main.bin" "$OUT/"
          cp "$GITHUB_WORKSPACE/config/gpt/gpt_pmos_backup.bin" "$OUT/"
          cp "$GITHUB_WORKSPACE/config/gpt/rawprogram0.xml" "$OUT/"
          echo "=== GPT files ==="
          ls -lh "$OUT/gpt_pmos_main.bin" "$OUT/gpt_pmos_backup.bin" "$OUT/rawprogram0.xml"

          # 复制中文 EDL 工具说明文档
          cp "$GITHUB_WORKSPACE/tools/edl/readme.txt" "$OUT/README_edl.txt"

          # A pmbootstrap disk image carries its own GPT.  Writing that into the
          # userdata partition nests a partition table inside a partition and
          # the kernel finds no root filesystem - the device just hangs.  Carve
          # the root partition out so what ships is a plain ext4 filesystem.
          # Exit code 2 means the image was already ext4 (the --split case).
          echo "=== Normalising rootfs images ==="
          for img in "$OUT"/*.img; do
            [ -f "$img" ] || continue
            case "$(basename "$img")" in boot.img) continue ;; esac
            echo "--- $(basename "$img")"
            set +e
            python3 "$GITHUB_WORKSPACE/tools/carve_rootfs.py" "$img" -o "$img.rootfs"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              mv "$img.rootfs" "$img"
            elif [ "$rc" -eq 2 ]; then
              echo "    already a plain ext4 image"
            else
              echo "ERROR: cannot produce a usable rootfs from $(basename "$img")"
              exit 1
            fi
          done

          # edl.exe 不支持 Android sparse 格式直写；确保 rootfs 是 raw ext4
          echo "=== Checking / converting sparse images ==="
          for img in "$OUT"/*.img; do
            [ -f "$img" ] || continue
            python3 "$GITHUB_WORKSPACE/tools/sparse2raw.py" "$img"
          done

          ls -lh "$OUT/"
          
          # 打包成 zip（不包含 vmlinuz，包含 readme）
          cd "$OUT"
          ZIP_NAME="msm8916-pmos-fullcompile.zip"
          
          echo "=== Creating $ZIP_NAME ==="
          zip -r "$ZIP_NAME" . --exclude "*/vmlinuz*" 
          
          SIZE=$(stat -c%s "$ZIP_NAME" 2>/dev/null || echo 0)
          echo "=== ZIP size: $(numfmt --to=iec $SIZE) ==="
          echo "=== Within 2GB limit: YES ==="
          
          echo "=== ZIP 内容概览 ==="
          zipinfo -1 "$ZIP_NAME"
          
          ls -lh "$ZIP_NAME"

      # ==================================================================
      # 7. Upload to GitHub Releases
      # ==================================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: v2024.08-msm8916-full
          name: "MSM8916 pmOS Full Compile - ${{ github.event.inputs.variant }} - ${{ github.event.inputs.release_channel }}"
          files: out/msm8916-pmos-fullcompile.zip
          body: |
            ## postmarketOS for MSM8916 (UFI003-02) - FULL COMPILE

            **Device**: UFI003-02 (MSM8916 Snapdragon 410)
            **Mode**: Full Compile (lk1st included)

            ### Download
            - `msm8916-pmos-fullcompile.zip` - Full package (rootfs + boot + lk1st + .bat scripts + EDL Chinese guide)

            ### Flash Instructions - 刷机说明
            **Using EDL mode - EDL 模式使用**:
            ```
            # 1. 安装驱动 (见 ZIP 中 README_edl.txt)
            #    使用 Zadig 安装 WinUSB 驱动
            #    进入 EDL 模式: Vol Down + USB
            # 2. 首次刷机运行 flash_edl_original.bat（自动改 GPT + 备份 NV）
            # 3. 后续更新运行 flash_edl_secondary.bat（只写 boot + userdata）
            # 4. Follow script prompts / 按脚本提示操作
            ```

            **Using fastboot - fastboot 用法**:
            ```
            # 1. Boot to fastboot: Vol Down + Power + USB
            # 2. flash boot boot.img
            # 3. flash userdata 410stick-ufi003-mb-v02.img
            # 4. Reboot: fastboot reboot
            ```

            ### Notes - 注记
            - Full compile includes: rootfs, boot.img, lk1st binary, new GPT, Windows .bat flashing scripts, EDL Chinese guide
            - The original flash script now automatically repartitions the eMMC (boot 32MB, userdata ~3.3GB)
            - based on postmarketOS edge channel
            - Device: 410stick-ufi003-mb-v02 (MSM8916 / UFI003-02)

      # ==================================================================
      # 8. Notify (optional)
      # ==================================================================
      - name: Success notification
        run: echo "pmOS build completed successfully for MSM8916!"