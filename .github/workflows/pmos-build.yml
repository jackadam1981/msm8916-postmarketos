name: Build pmOS for MSM8916

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'pmOS variant (phosh, phosh_light, sxmo, etc.)'
        required: true
        default: 'phosh'
      release_channel:
        description: 'postmarketOS release channel'
        required: true
        default: 'edge'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: read

    steps:
      # ==================================================================
      # 1. Checkout repository
      # ==================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================================================================
      # 2. Setup Docker (builtin compose, no external action needed)
      # ==================================================================
      - name: Install Docker Compose
        run: |
          # GitHub Ubuntu runners have docker compose pre-installed
          # Verify it's available
          docker compose version

      # ==================================================================
      # 3. Start pmbuild container
      # ==================================================================
      - name: Start pmbuild container
        run: |
          docker compose up -d
          # Wait for container to be ready
          sleep 10

      # ==================================================================
      # 3.5 Update pmbootstrap to latest (image ships a pre-migration version)
      # ==================================================================
      - name: Update pmbootstrap to latest
        run: |
          docker compose exec builder bash -c "
            rm -rf /opt/pmbootstrap
            git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /opt/pmbootstrap
            ln -sf /opt/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
            pmbootstrap --version
          "

      # ==================================================================
      # 3.5 Install required tools (kpartx, procps for ps)
      # ==================================================================
      - name: Install required tools
        run: |
          docker compose exec builder bash -c "
            apt-get update -qq
            apt-get install -y -qq kpartx procps kmod
          "

      # ==================================================================
      # 4. Configure pmbootstrap (v3: config file + pmaports clone)
      # ==================================================================
      - name: Configure pmbootstrap
        run: |
          docker compose exec builder bash -c "
            set -eu
            WORK=\$HOME/.local/var/pmbootstrap
            CFG=\$HOME/.config/pmbootstrap_v3.cfg
            DEVICE=generic-zhihe

            mkdir -p \$WORK/cache_git
            printf '8\n' > \$WORK/version
            if [ ! -d \$WORK/cache_git/pmaports ]; then
              git clone --depth=1 https://github.com/mainlining/pmaports.git \
                \$WORK/cache_git/pmaports
              git -C \$WORK/cache_git/pmaports remote set-url origin \
                https://gitlab.postmarketos.org/postmarketOS/pmaports.git
              git -C \$WORK/cache_git/pmaports update-ref refs/remotes/origin/main \
                \$(git -C \$WORK/cache_git/pmaports rev-parse HEAD)
            fi

            mkdir -p \$HOME/.config
            printf '%s\n' \
              '[pmbootstrap]' \
              \"work = \$WORK\" \
              \"device = \$DEVICE\" \
              'kernel = ufi001c' \
              'ui = console' \
              'user = pmos' \
              'extra_space = 0' \
              '' \
              '[providers]' \
              '' \
              '[mirrors]' \
              > \$CFG
            cat \$CFG
          "

      # ==================================================================
      # 5. Build rootfs and images
      # ==================================================================
      - name: Build rootfs and images
        run: |
          # Install pmOS base system
          docker compose exec builder pmbootstrap --as-root install --password pmos --no-fde --zap

          # Generate initramfs and boot images
          docker compose exec builder pmbootstrap --as-root initfs

          # Export images for use
          docker compose exec builder mkdir -p /build/out
          docker compose exec builder pmbootstrap --as-root export /build/out/
          docker compose exec builder ls -lh /build/out/

      # ==================================================================
      # 5. Collect and split images (GitHub 2GB release limit)
      # ==================================================================
      - name: Convert and split images
        run: |
          # Images are exported into the container's /build/out/
          # which is mounted to the repo's ./out/ via docker-compose.
          mkdir -p out
          ls -lh out/

          # Split any image larger than 2GB (GitHub release limit)
          for f in out/*.img out/*.img.xz out/*.gz; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 2000000000 ]; then
              echo "Splitting large file: $f ($size bytes)"
              cd "$(dirname "$f")"
              split -b 1900M -d -a 2 "$(basename "$f")" "$(basename "$f").part."
              rm -f "$(basename "$f")"
              cd -
            fi
          done
          ls -lh out/

      # ==================================================================
      # 6. Upload to GitHub Releases
      # ==================================================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2024.08-msm8916
          name: "MSM8916 pmOS Build - ${{ github.event.inputs.variant }} - ${{ github.event.inputs.release_channel }}"
          files: out/*
          body: |
            ## 📱 postmarketOS for MSM8916 (UFI003-02)

            **Device**: UFI003-02 (MSM8916 Snapdragon 410)
            **Variant**: ${{ github.event.inputs.variant }}
            **Channel**: ${{ github.event.inputs.release_channel }}

            ### 📥 Download
            - `pmos-rootfs.img` - Root filesystem (ext4)
            - `pmos-full.img` - Complete eMMC image
            - `lk2nd.img` - Secondary bootloader

            ### 🛠️ Flash Instructions
            **Using EDL (Recommended)**:
            ```bash
            # 1. Enter EDL mode: Vol Down + Power + USB
            # 2. Run: .\tools\edl\run-edl.bat w userdata out\emmc_full.img
            # 3. Verify: .\tools\edl\run-edl.ps1 printgpt
            ```

            **Using fastboot**:
            ```bash
            # 1. Boot to fastboot: Vol Down + Power + USB
            # 2. flash boot: fastboot flash boot boot.img
            # 3. flash pmos_rootfs: fastboot flash pmos_rootfs rootfs.img
            # 4. Reboot: fastboot reboot
            ```

            ### 📦 Contents
            - `images/pmos-rootfs.img` - Root partition (ext4)
            - `images/pmos-full.img` - Complete eMMC image
            - `lk2nd.img` - Secondary bootloader (if applicable)

            ### 📋 Notes
            - First boot will automatically expand rootfs to fill eMMC
            - NV data (modem, persist, etc.) preserved in original partitions
            - based on postmarketOS `edge` channel
            - Device tree: `zhihe-ufi003-mb-v02`

      # ==================================================================
      # 7. Notify (optional)
      # ==================================================================
      - name: Success notification
        run: echo "✅ pmOS build completed successfully for MSM8916!"