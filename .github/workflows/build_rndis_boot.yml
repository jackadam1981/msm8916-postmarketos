name: Build RNDIS Boot Image from PMOS Source

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如: 23.02, auto)'
        default: 'auto'
        required: false

jobs:
  build-boot:
    runs-on: linux-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check PMOS version
        run: python scripts/check_version.py ${{ github.event.inputs.version }}

      - name: Conditional build step
        if: success()
        run: echo "🔨 版本检查通过，开始构建..."

      - name: Build from PMOS source
        if: failure()  # 仅在版本检查需要构建时运行
        run: python scripts/pmos_build.py --version ${{ github.event.inputs.version }}

      - name: Verify OS Descriptor
        run: python scripts/compile_rndis_boot.py

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rndis-boot-img
          path: tools/flash/build_boot_rndis_osdesc.img
          retention-days: 7
          
      - name: Usage Instructions
        run: |
          echo ""
          echo "=========================================="
          echo "Generated artifact: rndis-boot-img"
          echo "=========================================="
          echo ""
          echo "This boot image includes Microsoft OS Descriptor that enables:"
          echo "  • Windows automatic RNDIS driver recognition"
          echo "  • No need to reinstall drivers on each connection"
          echo "  • Subclass 0x06 (ECM/RNDIS) with MS OS Descriptor"
          echo ""
          echo "To use:"
          echo "  1. Download the artifact from this workflow run"
          echo "  2. Flash to device via EDL mode:"
          echo "     python tools/edl/flash_410stick.py --os pmos"
          echo "  3. Disconnect and reconnect USB"
          echo "  4. Windows will auto-install RNDIS driver"
          echo "=========================================="