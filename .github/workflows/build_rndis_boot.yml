name: Build RNDIS Boot Image with Windows Auto-Driver Support

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-boot:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip || echo "pip upgrade skipped"

      - name: Install edlclient (may fail - will try alternative)
        continue-on-error: true
        run: |
          pip install edlclient || echo "edlclient install skipped - using alternative method"
          
      - name: Build boot image with OS Descriptor
        run: |
          python scripts/flash_410stick.py --os pmos --boot tools/flash/build_boot_rndis_osdesc.img
          
      - name: Verify OS Descriptor integration
        run: python tools/verify_os_desc.py tools/flash/build_boot_rndis_osdesc.img
          
      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rndis-boot-img
          path: tools/flash/build_boot_rndis_osdesc.img
          retention-days: 7
          
      - name: Usage Instructions
        run: |
          echo ""
          echo "=========================================="
          echo "Generated artifact: rndis-boot-img"
          echo "=========================================="
          echo ""
          echo "This boot image includes Microsoft OS Descriptor that enables:"
          echo "  • Windows automatic RNDIS driver recognition"
          echo "  • No need to reinstall drivers on each connection"
          echo "  • Subclass 0x06 (ECM/RNDIS) with MS OS Descriptor"
          echo ""
          echo "To use:"
          echo "  1. Download the artifact from this workflow run"
          echo "  2. Flash to device via EDL mode:"
          echo "     python tools/edl/flash_410stick.py --os pmos"
          echo "  3. Disconnect and reconnect USB"
          echo "  4. Windows will auto-install RNDIS driver"
          echo "=========================================="