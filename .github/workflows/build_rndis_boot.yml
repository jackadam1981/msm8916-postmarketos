name: Build RNDIS Boot and Rootfs Images from PMOS Source

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如: auto, 23.02)'
        default: 'auto'
        required: false

jobs:
  build-boot-and-rootfs:
    runs-on: linux-latest

    steps:
      # -------------------------------------------------------------
      # 1. Checkout repository
      # -------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check PMOS version
        run: python scripts/check_version.py "${{ github.event.inputs.version }}"

      # -------------------------------------------------------------
      # 4. Build boot and rootfs from PMOS source
      # -------------------------------------------------------------
      - name: Build boot and rootfs from PMOS source
        if: success()
        run: |
          set -e
          echo "🔧 安装构建依赖..."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pmbootstrap git e2fsprogs kmod cramfsprogs dosfstools
          echo "🔧 初始化 pmbootstrap..."
          pmbootstrap init --answer-timeout 30 <<EOF
auto
default
default
EOF
          echo "🔧 添加设备支持 msm8916..."
          pmbootstrap config --add-device msm8916
          echo "🔧 编译 boot.img..."
          pmbootstrap build boot
          echo "✅ boot.img 构建完成"
          echo "🔧 编译 rootfs.img..."
          pmbootstrap build rootfs
          echo "✅ rootfs.img 构建完成"

      - name: Verify OS Descriptor (boot.img)
        run: |
          python3 -c "
import struct, sys
ok = False
try:
    with open('tools/flash/build_boot_rndis_osdesc.img', 'rb') as f:
        d = f.read()
    s = len(d) / 1024 / 1024
    v = struct.unpack('<H', d[4:6])[0] if len(d) > 6 else 0
    p = struct.unpack('<H', d[6:8])[0] if len(d) > 8 else 0
    ok = s >= 20 and v == 0x05c6 and p == 0x90b4
    sys.exit(0 if ok else 1)
except:
    sys.exit(1)
"
      ,
      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rndis-boot-img
          path: tools/flash/build_boot_rndis_osdesc.img
          retention-days: 7

      - name: Upload rootfs image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rndis-rootfs-img
          path: "/out/rootfs/*.img"
          retention-days: 7

      - name: Usage Instructions
        run: |
echo ""
echo "=========================================="
echo "Generated artifacts:"
echo "  • rndis-boot-img (boot.img with OS Descriptor)"
echo "  • rndis-rootfs-img (rootfs.img)"
echo ""
echo "This boot image includes Microsoft OS Descriptor that enables:"
echo "  • Windows automatic RNDIS driver recognition"
echo "  • No need to reinstall drivers on each connection"
echo "  • Subclass 0x06 (ECM/RNDIS) with MS OS Descriptor"
echo ""
echo "To use:"
echo "  1. Download the artifacts from this workflow run"
echo "  2. Flash boot.img via EDL mode:"
echo "     python tools/edl/flash_410stick.py --os pmos --boot tools/flash/build_boot_rndis_osdesc.img"
echo "  3. Flash rootfs.img via EDL mode:"
echo "     python tools/edl/flash_410stick.py --os pmos --rootfs <path_to_rootfs_img>"
echo "  4. Disconnect and reconnect USB"
echo "  5. Windows will auto-install RNDIS driver"
echo "=========================================="