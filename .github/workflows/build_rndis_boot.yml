name: Build RNDIS Boot and Rootfs Images from PMOS Source

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如: auto, 23.02)'
        default: 'auto'
        required: false

jobs:
  build-boot-and-rootfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check PMOS version
        run: python scripts/check_version.py "${{ github.event.inputs.version }}"

      - name: Install pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          sudo ln -sf /tmp/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
          pmbootstrap --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git e2fsprogs kmod dosfstools
          modprobe loop 2>&1 || echo "loop module not available"

      - name: Configure pmbootstrap
        run: |
          set -eu
          DEVICE="msm8916"
          WORK="$HOME/.local/var/pmbootstrap"
          mkdir -p "$WORK/cache_git"
          printf '8\n' > "$WORK/version"

          # Clone pmaports so pmbootstrap can find device packages
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$WORK/cache_git/pmaports"
          git -C "$WORK/cache_git/pmaports" update-ref refs/remotes/origin/main \
            "$(git -C "$WORK/cache_git/pmaports" rev-parse HEAD)"

          # Write pmbootstrap config (printf avoids heredoc indent issues)
          mkdir -p "$HOME/.config"
          printf '%s\n' \
            '[pmbootstrap]' \
            "work = $WORK" \
            "device = $DEVICE" \
            'ui = console' \
            'user = pmos' \
            'extra_space = 0' \
            '' \
            '[mirrors]' \
            'alpine = https://dl-cdn.alpinelinux.org/alpine/' \
            'pmaports = https://mirror.postmarketos.org/postmarketos/' \
            > "$HOME/.config/pmbootstrap_v3.cfg"
          cat "$HOME/.config/pmbootstrap_v3.cfg"

      - name: Build boot image
        run: pmbootstrap build boot

      - name: Build rootfs
        run: pmbootstrap build rootfs

      - name: Verify OS Descriptor (boot.img)
        run: python scripts/verify_osdesc.py
      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rndis-boot-img
          path: tools/flash/build_boot_rndis_osdesc.img
          retention-days: 7

      - name: Upload rootfs image artifact
        uses: actions/upload-artifact@v4
        with:
          name: rndis-rootfs-img
          path: ~/.local/var/pmbootstrap/output/*.img
          retention-days: 7
          if-no-files-found: warn

      - name: Usage Instructions
        run: echo "See artifact logs for usage details"