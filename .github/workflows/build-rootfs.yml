name: build-rootfs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-rootfs.yml'
      - 'config/pmbootstrap-build.cfg'
      - 'config/device-testing/**'
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq kpartx coreutils parted e2fsprogs

      - name: Install pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          sudo ln -sf /tmp/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
          pmbootstrap --version

      - name: Build rootfs
        run: |
          set -eu
          DEVICE="410stick-ufi003-mb-v02"
          WORK="$HOME/.local/var/pmbootstrap"

          echo "=== Loop device support ==="
          ls -la /dev/loop* 2>&1 || true

          mkdir -p "$WORK/cache_git"
          printf '8\n' > "$WORK/version"

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$WORK/cache_git/pmaports"

          # Merge local device overlay
          OVERLAY_SRC="$GITHUB_WORKSPACE/config/device-testing"
          if [ -d "$OVERLAY_SRC" ]; then
            echo "=== Merging local device overlay from $OVERLAY_SRC ==="
            for device_dir in "$OVERLAY_SRC"/*/; do
              [ -d "$device_dir" ] || continue
              devname=$(basename "$device_dir")
              echo "  Adding device: $devname"
              cp -r "$device_dir" "$WORK/cache_git/pmaports/device/testing/$devname"
            done
          fi

          DEVICE_DIR="device-${DEVICE}"
          if [ ! -f "$WORK/cache_git/pmaports/device/testing/${DEVICE_DIR}/deviceinfo" ]; then
            echo "ERROR: Device overlay not found at device/testing/${DEVICE_DIR}/deviceinfo"
            ls "$WORK/cache_git/pmaports/device/testing/" 2>/dev/null || echo "(device/testing/ missing)"
            exit 1
          fi

          git -C "$WORK/cache_git/pmaports" update-ref refs/remotes/origin/main \
            "$(git -C "$WORK/cache_git/pmaports" rev-parse HEAD)"
          echo "=== pmaports git refs ==="
          git -C "$WORK/cache_git/pmaports" show-ref | head -5

          mkdir -p "$HOME/.config"
          printf '%s\n' \
            '[pmbootstrap]' \
            "work = $WORK" \
            "device = $DEVICE" \
            'ui = console' \
            'user = pmos' \
            'extra_space = 0' \
            '' \
            '[mirrors]' \
            'alpine = https://dl-cdn.alpinelinux.org/alpine/' \
            'pmaports = https://mirror.postmarketos.org/postmarketos/' \
            > "$HOME/.config/pmbootstrap_v3.cfg"
          cat "$HOME/.config/pmbootstrap_v3.cfg"

          pmbootstrap --as-root install --password pmos --no-fde

          pmbootstrap --as-root shutdown

          mkdir -p "$GITHUB_WORKSPACE/out"
          echo "=== Copying images to $GITHUB_WORKSPACE/out/ ==="
          find "$WORK" -type f \( -name "*.img" -o -name "boot.img" \) \
            -not -path "*/cache*" 2>/dev/null | while read f; do
            cp -L "$f" "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          done
          ls -lh "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: pmos-images
          path: ${{ github.workspace }}/out/
          retention-days: 90